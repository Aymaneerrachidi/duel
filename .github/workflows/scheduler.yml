name: Refresh live duels
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-duel-scheduler
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh and settle due duels
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_ORIGIN" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_ORIGIN/api/cron"
